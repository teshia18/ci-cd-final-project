apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: openshift-client
spec:
  params:
    - name: SCRIPT
      type: string
      description: The OpenShift CLI script to run
  steps:
    - name: oc-command
      image: quay.io/openshift/origin-cli:latest
      script: |
        #!/bin/bash
        $(params.SCRIPT)
